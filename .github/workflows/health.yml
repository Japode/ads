name: Health

# The checks that need the network, kept out of the publish path.
#
# Nothing here can block a deploy, and that is the point: a destination rots with no edit
# to the catalogue — a repository turns private, a domain lapses, a path moves — so the
# question has to be asked on a clock rather than when someone happens to push.
#
# A failing run is the report. There is no collector, no dashboard and nothing to
# maintain: GitHub already mails the owner when a scheduled workflow fails, which is the
# whole notification system this project needs.

on:
  schedule:
    # 06:17 UTC daily. Not on the hour: every cron written by hand lands on :00, and the
    # runner queue is shorter three minutes either side of it.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two jobs and not two steps: a failing destination and a broken origin are unrelated
# problems, and a first step that exits stops a second step from ever running. Either one
# should be able to fail without hiding the other.
jobs:
  links:
    name: Destinations still answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check-links

  origin:
    name: The origin still behaves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Pages chooses the cross-origin header, the cache lifetime and the redirect. If it
      # ever stops sending the first of those, every banner on every host site stops
      # rendering at once and the error appears only in a stranger's console.
      - run: npm run check-origin
